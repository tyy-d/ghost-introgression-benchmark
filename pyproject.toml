[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbench"
version = "0.1.0"
description = "A nonhuman introgression benchmark for TRACE and ArchIE"
requires-python = ">=3.10"
dependencies = ["msprime>=1.3,<2", "tskit>=1,<2", "numpy>=1.26", "scipy>=1.11", "pandas>=2", "PyYAML>=6", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
empirical = ["malariagen-data>=15", "pysam>=0.22"]

[project.scripts]
ghostbench = "ghostbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
